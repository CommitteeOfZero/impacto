apply plugin: 'com.android.application'
apply from: 'signing.gradle'

def getVersionNameFromFile() {
    def versionFile = rootProject.file('../VERSION')
    if (versionFile.exists()) {
        String str = versionFile.text.trim();
        return str.substring(0, str.length() - 1);
    }
    return "1.0.0" // Fallback version if file is missing
}

android {
    defaultConfig {
        compileSdk 34
        applicationId "com.committeeofzero.impacto"
        minSdkVersion 28
        targetSdkVersion 34
        versionCode 1
        versionName getVersionNameFromFile()
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            resValue "string", "app_name", "Impacto"
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix '-DEBUG'
            resValue "string", "app_name", "Impacto Debug"
            debuggable true
            packaging {
                jniLibs {
                    keepDebugSymbols += "**/*.so"
                }
            }
        }
    }
    namespace 'com.committeeofzero.impacto'
    aaptOptions {
       noCompress 'mp4', 'mpk'
    }
    applicationVariants.all { variant ->
        def mergeTaskName = "merge${variant.name.capitalize()}NativeLibs"
        tasks.named(mergeTaskName).configure {
            outputs.upToDateWhen { false }
        }
    }

}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
}
